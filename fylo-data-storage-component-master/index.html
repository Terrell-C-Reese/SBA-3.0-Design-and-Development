<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://jsdelivr.net" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <title>Frontend Mentor | Fylo data storage component</title>
</head>
<body class="d-flex flex-column justify-content-center align-items-center min-vh100 px-3">
    <main class="storage-contain">
      <div class="row g-4 align-items-lg-end"></div>
        
      <section class="card col-12 col-lg-end">
        <section class="border-card border-0" >
          <div class="card-content p-5">
            <img src="./images/logo.svg" alt="Fylo logo">
          <div class="card-button d-flex gap-3">
          <button type="button" class="button-doc d-flex justify-content-center align-items-center" aria-label="Document">
        <img src="./images/icon-document.svg" alt="Fylo Document">
          </button>
          <button type="button" class="button-fold d-flex justify-content-center align-items-center" aria-label="Folder">
        <img src="./images/icon-folder.svg" alt="Fylo Folder">
          </button>
          <button type="button" class="button-load d-flex justify-content-center align-items-center" aria-label="Upload">
        <img src="./images/icon-upload.svg" alt="Fylo Upload">
          </button>
      
        You’ve used 815 GB of your storage

      185 GB Left
      0 GB
      1000 GB
              </div>
            </div>
          </section>
        </section>
    </main>


  
  
 
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
