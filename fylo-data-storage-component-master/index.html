<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Fylo data storage component</title>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 px-3">
  <main class="storage-layout container-fluid">
    <div class="row g-4 align-items-lg-end justify-content-center">
      <div class="col-12 col-lg-auto">
        <section class="storage-card card border-0" aria-label="Fylo storage actions">
          <div class="card-body p-4 p-lg-5">
            <img class="fylo-logo" src="./images/logo.svg" alt="Fylo">
            <div class="d-flex gap-3 mt-4">
              <button type="button" class="img-button d-flex justify-content-center align-items-center" aria-label="View documents">
                <img src="./images/icon-document.svg" alt="" aria-hidden="true">
              </button>
              <button type="button" class="img-button d-flex justify-content-center align-items-center" aria-label="View folders">
                <img src="./images/icon-folder.svg" alt="" aria-hidden="true">
              </button>
              <button type="button" class="img-button d-flex justify-content-center align-items-center" aria-label="Upload files">
                <img src="./images/icon-upload.svg" alt="" aria-hidden="true">
              </button>
            </div>
          </div>
        </section>
      </div>
      <div class="col-12 col-lg-auto">
        <section class="status-card card border-0" aria-label="Storage usage">
          <div class="card-body p-4 p-lg-5">
            <p class="status-text mb-3">You've used <strong>815 GB</strong> of your storage</p>
            <div class="storage-bar" role="progressbar" aria-label="815 GB of 1000 GB used" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="815">
              <div class="storage-progress"></div>
            </div>
            <div class="d-flex justify-content-between storage-limits mt-2">
              <span>0 GB</span>
              <span>1000 GB</span>
            </div>
            <div class="storage-remaining" aria-label="185 GB left">
              <strong>185</strong>
              <span>GB left</span>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
      
</body>
</html>
